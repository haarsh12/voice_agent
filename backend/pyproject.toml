[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sahayak-ai-backend"
version = "0.1.0"
description = "Sahayak AI multilingual voice assistant backend with LiveKit, Gemini and FastAPI"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents>=1.6.1,<2.0.0",
    "livekit-plugins-google>=1.6.0,<2.0.0",
    "livekit-plugins-cartesia>=1.6.0,<2.0.0",
    "livekit-plugins-ai-coustics>=0.3.0,<1.0.0",
    "livekit-api>=1.2.0,<2.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "google-genai>=2.18.0,<3.0.0",
    "Pillow>=10.4,<12.0",
    "pypdf>=5.9,<7.0",
    "python-multipart>=0.0.18,<1.0",
    "SQLAlchemy>=2.0.36,<3.0.0",
    "asyncpg>=0.30,<1.0.0",
    "aiosqlite>=0.20,<1.0.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "argon2-cffi>=23.1,<26.0",
    "httpx>=0.27,<1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
