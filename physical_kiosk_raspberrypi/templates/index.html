<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Sahayak AI — Kiosk Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e1b4b 100%);
      --glass-bg: rgba(15, 23, 42, 0.85);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-card-bg: rgba(30, 41, 59, 0.6);
      --accent-emerald: #10b981;
      --accent-cyan: #06b6d4;
      --accent-indigo: #6366f1;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    .kiosk-header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(90deg, #ffffff, #a5f3fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badges {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--glass-card-bg);
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid var(--glass-border);
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-emerald);
    }

    /* Responsive Main Container */
    .kiosk-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    @media (min-width: 900px) {
      .kiosk-main {
        display: grid;
        grid-template-columns: 1fr 400px;
        height: calc(100vh - 60px);
      }
    }

    .interactive-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ai-orb-card {
      position: relative;
      flex: 1;
      min-height: 240px;
      background: #090d16;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }

    .ai-orb {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-cyan) 0%, var(--accent-indigo) 70%);
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.6);
      animation: pulse-orb 2s infinite ease-in-out;
    }

    @keyframes pulse-orb {
      0%, 100% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 60px rgba(6, 182, 212, 0.8); }
    }

    /* Microphone Control Bar & Hold-to-Talk Button */
    .mic-control-bar {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .mic-button {
      height: 60px;
      padding: 0 28px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-cyan));
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
      white-space: nowrap;
    }

    .mic-button:active, .mic-button.recording {
      background: linear-gradient(135deg, var(--accent-rose), #e11d48);
      transform: scale(0.96);
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.6);
    }

    .mic-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
    }

    .audio-visualizer {
      flex: 1;
      height: 60px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      gap: 5px;
    }

    .v-bar {
      flex: 1;
      height: 8px;
      background: var(--accent-indigo);
      border-radius: 4px;
      transition: height 0.1s ease;
    }

    /* Conversation Sidebar Panel */
    .sidebar-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      height: 420px;
      overflow: hidden;
    }

    @media (min-width: 900px) {
      .sidebar-panel {
        height: 100%;
      }
    }

    .panel-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--glass-border);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .transcript-log {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-bubble {
      background: var(--glass-card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .chat-bubble.user {
      border-left: 4px solid var(--accent-cyan);
    }

    .chat-bubble.assistant {
      border-left: 4px solid var(--accent-emerald);
      background: rgba(16, 185, 129, 0.12);
    }

    .chat-bubble .timestamp {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <!-- Kiosk Header -->
  <header class="kiosk-header">
    <div class="brand">
      <div class="brand-logo">S</div>
      <div class="brand-title">Sahayak AI</div>
    </div>
    <div class="status-badges">
      <div class="status-pill">
        <div class="status-dot"></div>
        <span>Backend Connected</span>
      </div>
    </div>
  </header>

  <!-- Main Kiosk Layout -->
  <main class="kiosk-main">
    
    <!-- Left Section: AI Orb & Mic Controls -->
    <section class="interactive-section">
      
      <div class="ai-orb-card">
        <div class="ai-orb"></div>
        <h2 style="font-family: 'Outfit', sans-serif; font-size: 22px;">Sahayak Voice Assistant</h2>
        <p style="font-size: 14px; color: var(--text-muted); max-width: 320px;">Press & hold the button below to speak, or speak directly into the microphone.</p>
      </div>

      <!-- Push-to-Talk Mic Bar -->
      <div class="mic-control-bar">
        <button id="mic-btn" class="mic-button">
          <div class="mic-indicator"></div>
          <span id="btn-text">HOLD TO SPEAK</span>
        </button>

        <div class="audio-visualizer" id="visualizer">
          <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
          <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
          <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
          <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
        </div>
      </div>

    </section>

    <!-- Right Section: Real-time Conversation Chat Box -->
    <aside class="sidebar-panel">
      <div class="panel-header">
        <span>Live Conversation</span>
        <span style="font-size: 12px; color: var(--text-muted);">STT & Speech</span>
      </div>
      <div class="transcript-log" id="transcript-log">
        <div class="chat-bubble assistant">
          <div class="timestamp"><span>🤖 Sahayak AI</span><span>Ready</span></div>
          <div>Namaste! Welcome to Sahayak AI. How can I help you today?</div>
        </div>
      </div>
    </aside>

  </main>

  <script>
    const micBtn = document.getElementById('mic-btn');
    const btnText = document.getElementById('btn-text');
    const transcriptLog = document.getElementById('transcript-log');
    const vBars = document.querySelectorAll('.v-bar');

    let isRecording = false;

    const startRecording = async () => {
      if (isRecording) return;
      isRecording = true;
      micBtn.classList.add('recording');
      btnText.innerText = 'LISTENING...';
      try {
        await fetch('/start_recording', { method: 'POST' });
      } catch (err) {
        console.error('Failed to start recording', err);
      }
    };

    const stopRecording = async () => {
      if (!isRecording) return;
      isRecording = false;
      micBtn.classList.remove('recording');
      btnText.innerText = 'HOLD TO SPEAK';

      try {
        const res = await fetch('/stop_recording', { method: 'POST' });
        const data = await res.json();
        if (data.transcript && !data.transcript.startsWith('[')) {
          appendTranscript(data.timestamp || 'Now', data.transcript, 'user');
        }
      } catch (err) {
        console.error('Failed to stop recording', err);
      }
    };

    micBtn.addEventListener('mousedown', startRecording);
    micBtn.addEventListener('mouseup', stopRecording);
    micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
    micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });

    function appendTranscript(timeStr, text, sender = 'user') {
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${sender}`;
      const badge = sender === 'assistant' ? '🤖 Sahayak AI' : '👤 User';
      bubble.innerHTML = `<div class="timestamp"><span>${badge}</span><span>${timeStr}</span></div><div>${text}</div>`;
      transcriptLog.appendChild(bubble);
      transcriptLog.scrollTop = transcriptLog.scrollHeight;
    }

    const eventSource = new EventSource('/stream');
    eventSource.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'volume') {
        const level = data.level || 0.0;
        vBars.forEach((bar) => {
          const h = Math.max(6, Math.min(48, level * 260 * (0.5 + Math.random())));
          bar.style.height = `${h}px`;
        });
      } else if (data.type === 'transcript') {
        appendTranscript(data.timestamp, data.text, data.sender || 'user');
      }
    };
  </script>
</body>
</html>
