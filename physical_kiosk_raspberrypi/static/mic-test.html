<!DOCTYPE html>
<html>
<head>
    <title>Microphone Test</title>
    <style>
        body { font-family: Arial; padding: 40px; max-width: 600px; margin: 0 auto; }
        button { padding: 15px 30px; font-size: 16px; cursor: pointer; margin: 10px; }
        .success { color: green; }
        .error { color: red; }
        #status { margin: 20px 0; padding: 20px; background: #f0f0f0; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>🎤 Microphone Diagnostic Test</h1>
    
    <button onclick="testMicrophone()">Test Microphone</button>
    <button onclick="stopTest()">Stop Test</button>
    
    <div id="status">
        <p>Click "Test Microphone" to start</p>
    </div>
    
    <canvas id="visualizer" width="600" height="100" style="border: 1px solid #ccc;"></canvas>

    <script>
        let stream = null;
        let audioContext = null;
        let analyser = null;
        let animationId = null;

        async function testMicrophone() {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = '<p>🔄 Requesting microphone access...</p>';
            
            try {
                // List available devices
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(d => d.kind === 'audioinput');
                
                statusEl.innerHTML += `<p class="success">✅ Found ${audioInputs.length} audio input device(s):</p>`;
                audioInputs.forEach((device, i) => {
                    statusEl.innerHTML += `<p>&nbsp;&nbsp;${i + 1}. ${device.label || 'Unknown device'}</p>`;
                });
                
                // Request microphone access
                stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    } 
                });
                
                statusEl.innerHTML += '<p class="success">✅ Microphone access granted!</p>';
                statusEl.innerHTML += '<p>🎤 Speak now - you should see audio visualization below</p>';
                
                // Set up audio visualization
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                analyser.fftSize = 256;
                
                visualize();
                
            } catch (error) {
                statusEl.innerHTML += `<p class="error">❌ Error: ${error.name}</p>`;
                statusEl.innerHTML += `<p class="error">${error.message}</p>`;
                
                if (error.name === 'NotAllowedError') {
                    statusEl.innerHTML += '<p class="error">⚠️ Microphone permission denied. Please allow microphone access in your browser settings.</p>';
                } else if (error.name === 'NotFoundError') {
                    statusEl.innerHTML += '<p class="error">⚠️ No microphone found. Please connect a microphone.</p>';
                }
            }
        }
        
        function visualize() {
            const canvas = document.getElementById('visualizer');
            const ctx = canvas.getContext('2d');
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            function draw() {
                animationId = requestAnimationFrame(draw);
                analyser.getByteTimeDomainData(dataArray);
                
                ctx.fillStyle = '#f0f0f0';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#2563eb';
                ctx.beginPath();
                
                const sliceWidth = canvas.width / bufferLength;
                let x = 0;
                
                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = v * canvas.height / 2;
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                    
                    x += sliceWidth;
                }
                
                ctx.lineTo(canvas.width, canvas.height / 2);
                ctx.stroke();
            }
            
            draw();
        }
        
        function stopTest() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            document.getElementById('status').innerHTML = '<p>🛑 Test stopped</p>';
        }
    </script>
</body>
</html>
