name: sahayak_mobile
description: "Sahayak AI - Premium mobile application for government services and assistance"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  
  # State Management
  provider: ^6.1.2
  get_it: ^7.6.7
  
  # Navigation
  go_router: ^13.2.0
  
  # Network & API
  http: ^1.2.1
  dio: ^5.4.1
  connectivity_plus: ^6.0.5
  
  # LiveKit for Voice
  livekit_client: ^2.1.2
  permission_handler: ^11.3.0
  
  # Local Storage & Cache
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  
  # Security
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  
  # Authentication
  local_auth: ^2.2.0
  
  # UI Helpers
  intl: 0.20.2
  timeago: ^3.6.1
  flutter_markdown: ^0.6.20
  url_launcher: ^6.2.4
  
  # Image & File
  image_picker: ^1.0.7
  file_picker: ^8.1.7
  
  # QR & Barcode
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6
  
  # Utils
  uuid: ^4.3.3
  logger: ^2.0.2
  equatable: ^2.0.5
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/

  # Fonts are optional - uncomment when you add Inter font files
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700


# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/app_icon.png"
  adaptive_icon_background: "#A73439"
  adaptive_icon_foreground: "assets/logo/app_icon_fg.png"
